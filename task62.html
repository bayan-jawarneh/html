<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Styling text</title>
    <style>
        h1 {
            color: orange;
            font-family: Garamond, serif;
        }

        h2 {
            text-align: right;
            font-family: Verdana, sans-serif;
        }

        p {
            font-family: Verdana, sans-serif;
        }

        .second {
            font-family: "Courier New", monospace;
            text-align: right;
        }
    </style>
</head>
<body>

    <h1>Styling text</h1>

    <h2>Heading Num. 2</h2>

    <p>My first paragraph.</p>

    <p class="second">My second paragraph.</p>

</body>

<!DOCTYPE html>
<html>
<head>
    <title>Booking Form</title>
</head>
<body>

    <h1>Booking Form</h1>

    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
        placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
        placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
        placeholder="Enter your phone number" required>
        <br><br>

        <label for="destination">Destination:</label>
        <select id="destination" name="destination" required>
            <option value="">Choose a destination</option>
            <option value="Paris">Paris</option>
            <option value="London">London</option>
            <option value="Turkey">Turkey</option>
            <option value="Dubai">Dubai</option>
        </select>
        <br><br>

        <label for="date">Travel Date:</label>
        <input type="date" id="date" name="date" required>
        <br><br>

        <label for="travelers">Number of Travelers:</label>
        <input type="number" id="travelers" name="travelers"
        min="1" placeholder="Number of travelers" required>
        <br><br>

        <label>Travel Type:</label>
        <br>
        <input type="radio" id="oneway" name="traveltype" value="One Way">
        <label for="oneway">One Way</label>

        <input type="radio" id="roundtrip" name="traveltype" value="Round Trip">
        <label for="roundtrip">Round Trip</label>
        <br><br>

        <label for="notes">Additional Notes:</label>
        <br>
        <textarea id="notes" name="notes"
        placeholder="Write your notes here"></textarea>
        <br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I accept the terms and conditions</label>
        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
